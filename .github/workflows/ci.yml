name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[dev,train,analysis]'
      - run: ruff check stamp tests
      - run: ruff format --check stamp tests
      - run: pytest
      - run: python -m pip wheel . --no-deps --wheel-dir dist
